<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.HOSTED = true;</script>
</head>
<body>
<title>Nour</title>
<link rel="icon" href="./assets/nour-icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Slido-style look: flat white cards on a light grey page, one brand colour, clear type, results as thick bars.
   Teacher = slide stage left + tabbed control panel right; student = branded header + one focused card. */
:root{
  --paper:#F4F5F7; --card:#FFFFFF; --ink:#1B2230; --muted:#5E6878; --line:#E1E4EA; --soft:#EEF0F4;
  --accent:#0B7A84; --accent-2:#0A6A73; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1; --gold:#E2A132; --gold-soft:#FBF0DA;
  --good:#1E8A4C; --good-soft:#DDF2E5; --bad:#C23A3A; --bad-soft:#F8E0E0; --warn:#B7791F;
  --t0:#D25A22; --t0-soft:#FBE6DB; --t1:#2B66D1; --t1-soft:#DFE8FA; --t2:#7344C2; --t2-soft:#ECE3FA;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --f-display:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141D; --card:#171E2A; --ink:#E7EBF3; --muted:#9AA4B6; --line:#2A3344; --soft:#1F2735;
  --accent:#3CBEC7; --accent-2:#5FCFD6; --accent-ink:#06262A; --accent-soft:#13383C; --gold:#F0B755; --gold-soft:#3A2E17;
  --good:#4CC27F; --good-soft:#163526; --bad:#EE7272; --bad-soft:#3A1C1E; --warn:#E3A84A;
  --t0:#F08954; --t0-soft:#3A2418; --t1:#6E9BF0; --t1-soft:#1B2945; --t2:#A985EB; --t2-soft:#2A2042;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141D; --card:#171E2A; --ink:#E7EBF3; --muted:#9AA4B6; --line:#2A3344; --soft:#1F2735;
  --accent:#3CBEC7; --accent-2:#5FCFD6; --accent-ink:#06262A; --accent-soft:#13383C; --gold:#F0B755; --gold-soft:#3A2E17;
  --good:#4CC27F; --good-soft:#163526; --bad:#EE7272; --bad-soft:#3A1C1E; --warn:#E3A84A;
  --t0:#F08954; --t0-soft:#3A2418; --t1:#6E9BF0; --t1-soft:#1B2945; --t2:#A985EB; --t2-soft:#2A2042;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--accent)}
.wrap{padding-inline:16px;padding-block:0 40px;max-width:1360px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--muted);background:var(--soft)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible,.thumb:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 12px;font-size:14px}
.btn.lg{min-height:52px;font-size:17px;padding:10px 22px;border-radius:10px}
.btn.block{width:100%}
input[type=text],input[type=number],textarea,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* top bar (teacher): white app header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin:0 -16px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;line-height:1.2}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.brand img{border-radius:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

/* student header: brand-coloured bar with the event name and #code, like a Slido event */
.sbar{margin:0 -16px 18px;background:var(--accent);color:var(--accent-ink);padding:12px 16px}
.sbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sbar img{border-radius:8px;background:#fff;padding:2px;flex:none}
.sbar b{font-size:17px;display:block;line-height:1.25}
.sbar small{display:block;opacity:.85;font-size:13px}
.sbar .pill{background:rgba(255,255,255,.18);color:inherit}
.sbar .dot.live{background:#7CF0A7;box-shadow:0 0 0 3px rgba(124,240,167,.25)}
.sbar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:inherit}

/* join landing: one big code box, the Slido way */
.hero{max-width:520px;margin:6vh auto 0;display:grid;gap:18px;text-align:center}
.hero .logo{justify-self:center;width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow-lg)}
.hero h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0}
.joinbox{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);padding:20px;display:grid;gap:12px;text-align:left}
.codefield{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;background:var(--card);padding-left:14px}
.codefield:focus-within{border-color:var(--accent)}
.codefield span{font:700 24px var(--f-mono);color:var(--muted)}
.codefield input[type=text]{border:0;font:700 24px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:12px 10px;background:transparent}
.codefield input:focus-visible{outline:none}
.hero .foot{font-size:14px;color:var(--muted)}

/* teacher grid */
.tgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:min(52vw,480px);max-width:100%;padding:clamp(18px,3.2vw,40px);display:flex;flex-direction:column;gap:14px;position:relative;min-width:0}
.stage .kind{display:flex;gap:8px;align-items:center}
.stage h2{font-size:clamp(22px,2.8vw,36px);font-weight:700;letter-spacing:-.02em}
.stage .body{font-size:clamp(16px,1.6vw,20px);white-space:pre-wrap;max-width:60ch}
.sopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:auto}
.sopt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:clamp(15px,1.5vw,19px);font-weight:600;display:flex;gap:12px;align-items:center;background:var(--card)}
.sopt .let,.opt .let{font:600 13px var(--f-body);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted);flex:none}
.sopt.correct{border-color:var(--good);background:var(--good-soft)}
.sopt.correct .let{background:var(--good);border-color:var(--good);color:#fff}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px}
.thumb{flex:none;width:112px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px;text-align:left;cursor:pointer;font-size:12px;line-height:1.3;box-shadow:var(--shadow)}
.thumb b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.thumb span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* join banner on the projected slide: "Join at … #CODE" + QR */
.joinbar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:2px}
.joinbar .qr{width:clamp(64px,8vw,104px);height:auto;flex:none;border-radius:6px}
.joinbar .jt{display:grid;gap:2px;min-width:0}
.joinbar .jt span{font-size:clamp(13px,1.2vw,16px);color:var(--muted)}
.joinbar .jt b{font-size:clamp(16px,1.6vw,22px);word-break:break-all}
.joinbar .jcode{margin-left:auto;font:700 clamp(22px,3vw,40px)/1 var(--f-mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.joincard{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.joincard .qr{width:100%;max-width:240px;height:auto;border-radius:8px}
.joincard .jcode{font:700 clamp(26px,4vw,44px)/1 var(--f-mono);letter-spacing:.08em;color:var(--accent)}
.joincard .jsite{font-size:14px;color:var(--muted);word-break:break-all}
.qr{display:block;background:#fff}
.joinsplit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,3vw,40px);align-items:center;margin-top:auto}
.joinsplit .qr{width:clamp(140px,20vw,260px);height:auto;border-radius:10px;box-shadow:var(--shadow)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;padding-inline:6px}
.tab{background:none;border:0;padding:13px 12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.cur{color:var(--accent);border-bottom-color:var(--accent)}
.pbody{padding:16px;display:grid;gap:14px}

/* results bars: label, thick bar, count and percent */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.bar .lab{font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.bar .track{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);min-width:0}
.bar.ok .fill{background:var(--good)}
.bar.ok .lab{color:var(--good)}
.bar .n{white-space:nowrap;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:14px;align-self:start;margin-top:28px}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font:700 28px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.resp{display:grid;gap:8px;max-height:320px;overflow:auto}
.resp div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--card);box-shadow:var(--shadow)}
.resp b{display:block;font-size:12px;color:var(--muted)}

.question-picture img{max-height:230px;width:100%;object-fit:contain;border-radius:10px}
.voter-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.voter-chips .pill{font-size:12px;padding:2px 7px}
.leaderboard ol{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:none}
.leaderboard li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--soft);padding:10px 12px;border-radius:10px}
.leaderboard li:first-child{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.leaderboard small{grid-column:1/-1;color:var(--muted)}
.leaderboard h3{margin:0 0 10px}

/* class table */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.m{font-family:var(--f-mono);text-align:center}
.mk-y{color:var(--good);font-weight:700}.mk-n{color:var(--bad);font-weight:700}.mk-p{color:var(--warn);font-weight:700}
.chip{border:0;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}
.g0{background:var(--t0-soft);color:var(--t0)}.g1{background:var(--t1-soft);color:var(--t1)}.g2{background:var(--t2-soft);color:var(--t2)}.gx{background:var(--soft);color:var(--muted)}
.chip.ovr{box-shadow:inset 0 0 0 2px currentColor}

/* groups */
.gcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.gcols{grid-template-columns:1fr}}
.gcol{border-radius:10px;padding:12px;border-top:4px solid}
.gcol.c0{background:var(--t0-soft);border-color:var(--t0)}.gcol.c1{background:var(--t1-soft);border-color:var(--t1)}.gcol.c2{background:var(--t2-soft);border-color:var(--t2)}
.gcol input{font-weight:600;margin-bottom:6px;font-size:14px;padding:6px 8px}
.gcol ul{margin:0;padding-left:18px;font-size:14px}
.scale{position:relative;height:28px;border-radius:999px;overflow:hidden;display:flex;font:600 12px var(--f-body)}
.scale div{display:grid;place-items:center;color:#fff}

/* editor */
.ed{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}
@media (max-width:560px){.ed{grid-template-columns:1fr}}
.elist{display:grid;gap:4px;align-content:start;max-height:520px;overflow:auto}
.elist button{text-align:left;border:1px solid transparent;background:var(--soft);border-radius:8px;padding:7px 9px;font-size:13px;cursor:pointer}
.elist button:hover{border-color:var(--line)}
.elist button.cur{border-color:var(--accent);background:var(--accent-soft)}
.optrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}

/* student */
.swrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:clamp(18px,4vw,28px);display:grid;gap:16px}
.scard h2{font-size:clamp(20px,4.6vw,26px);font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--card);cursor:pointer;text-align:left;font-weight:500;font-size:17px;min-height:56px;width:100%;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale5 .opt{justify-content:center;font-size:22px;font-weight:700;padding:12px 0}
.fb{border-radius:10px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}.fb.info{background:var(--soft);color:var(--muted)}
.task{border-radius:12px;padding:18px;border-left:6px solid;display:grid;gap:8px}
.task.c0{background:var(--t0-soft);border-color:var(--t0)}.task.c1{background:var(--t1-soft);border-color:var(--t1)}.task.c2{background:var(--t2-soft);border-color:var(--t2)}
.task p{margin:0;white-space:pre-wrap;font-size:17px}
.center{display:grid;place-items:center;text-align:center;gap:12px;padding-block:40px}
.waitart{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.waitart i{width:18px;height:18px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.note{font-size:14px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--muted)}

/* present */
.present{position:fixed;inset:0;background:var(--paper);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:20px;overflow:auto}
.present .stage{aspect-ratio:auto;min-height:calc(100vh - 32px)}
@media (max-width:800px){.present{grid-template-columns:1fr}}
.code{font:700 clamp(40px,7vw,88px)/1 var(--f-mono);letter-spacing:.1em;color:var(--accent)}
.codepill{font-family:var(--f-mono);letter-spacing:.06em;background:var(--accent-soft);color:var(--ink)}
.tnotes{margin-top:12px;border-left:4px solid var(--gold);background:var(--card);border-radius:8px;padding:10px 14px;font-size:15px;white-space:pre-wrap;box-shadow:var(--shadow)}
pre.codebox{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:500 clamp(14px,1.5vw,18px)/1.5 var(--f-mono);overflow-x:auto;white-space:pre;max-width:100%}
.explain{border-left:4px solid var(--good);background:var(--good-soft);border-radius:8px;padding:10px 14px;font-size:16px}
.slideimg{width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--soft);border-radius:10px;border:1px solid var(--line);display:block}
.stage.hasimg{padding:clamp(10px,1.5vw,16px)}
.imgph{width:100%;aspect-ratio:16/9;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:14px}
.import{border:1px dashed var(--accent);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand">Nour<small>Connecting to your class…</small></div>
  </div>
  <div class="center">
    <h2>Getting the lesson ready</h2>
    <p class="muted">Teachers see the slides, live answers and groups. Students see one question at a time and their own group task.</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import * as nourPolicy from "./presentation-state.js?v=nour-1.3";
window.NOUR_POLICY = nourPolicy;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

"s8","type":"poll","title":"Learning continuum: where are you now?","body":"Read the objective and both success criteria. Pick where you are right now. We will come back to this twice.","options":["1. Starting: I cannot write an if statement yet","2. Developing: I can predict which lines run in an if statement","3. Secure: I can write if and if-else, and test the boundary","4. Extending: I can use elif in the right order and explain why"],"match":"LEARNING CONTINUUM · START OF LESSON"},{"id":"s9","type":"info","title":"Why this matters","body":"National identity\nUAE weather apps and smart buildings decide when to send heat alerts using conditions: if the temperature is above a limit, act. Today you write the same kind of decision.\n\nCharacter focus: resilience\nTest the case that might fail, not just the one you expect to pass. When a condition gives the wrong result, read it again, test the edge and fix it.\n\nSustainability: SDG 7, affordable and clean energy\nSmart air conditioning runs only if a room is occupied and too warm. One well-written condition saves energy in thousands of buildings.","match":"Character Focus"},{"id":"s10","type":"info","title":"Start Strong: logic or luck?","body":"Game 1: you guess my number\nI am thinking of a number from 1 to 100. Call out a guess. I answer Higher, Lower or Correct.\n\nGame 2: the computer guesses yours\nChoose a secret number from 1 to 100 as a class. Answer the computer's guesses with Higher, Lower or Correct.\n\nAs you play: how many guesses did each game take? Who used logic, and who used luck? Keep a tally on your Show Me board.\n\nSC1 · Writing an if statement","match":"THE GUESSING GAME"},{"id":"s11","type":"open","title":"Logic or luck? How was the way WE guessed different from the way the COMPUTER guessed?","body":"Think on your own, then discuss with your partner.\nScaffold: \"We guessed by ___, but the computer ___ because ___.\"\nWord bank: feel · luck · picked the middle · followed rules · halved the numbers · it used logic","match":"THINK, PAIR, SHOW"},{"id":"s12","type":"info","title":"From game to code: Game 1 was a program","code":"secret = 37\nguess = int(input(\"Your guess: \"))\nif guess < secret:\n    print(\"Higher\")\nelif guess > secret:\n    print(\"Lower\")\nelse:\n    print(\"Correct!\")","body":"Predict: what prints if guess = 50?\n\nEvery answer you got was a decision: a condition that is True or False, and a different action for each result. By the end of today you will be able to write this program yourself.","match":"Game 1 Was a Program"},{"id":"s13","type":"info","title":"Key vocabulary","body":"condition: a question Python answers with True or False (temp > 40)\nBoolean: a value that is only True or False\nif: runs a block only when its condition is True\ncolon : ends every if, elif and else line\nindentation: 4 spaces that put a line inside a block\nblock: the indented lines that belong to an if or else\nelif: checks another condition when those above were False\nboundary: the exact value where the answer changes (40 in temp >= 40)","match":"Words We Will Use Today"},{"id":"s14","type":"info","title":"I do: decisions as a flowchart (Abu Dhabi weather app)","code":"temp = 44\nif temp > 40:\n    print(\"Stay in the shade!\")\nprint(\"Enjoy Abu Dhabi!\")","body":"Run 1, August, temp = 44: 44 > 40 is True → Stay in the shade! then Enjoy Abu Dhabi!\nRun 2, January, temp = 24: 24 > 40 is False → Enjoy Abu Dhabi!\n\nOnly the True path runs the indented line. Both paths meet again at the line that is not indented.\n\nSC1 · Writing an if statement","match":"Decisions as a Flowchart"},{"id":"s15","type":"info","title":"I do: anatomy of an if statement","code":"# Abu Dhabi weather app\ntemp = 44\nif temp > 40:\n    print(\"Stay in the shade!\")\nprint(\"Enjoy Abu Dhabi!\")","body":"if: keyword that starts the decision\ntemp > 40: the condition, True or False\n: the colon ends the if line\n4 spaces: indentation puts the line inside the block\nno indent: outside the block, always runs\n\nThink aloud: an August afternoon, 44 > 40 is True, so the indented line runs. The last line is not indented, so it runs in any weather.","match":"Anatomy of an if Statement"},{"id":"s16","type":"mcq","title":"We do: same code, a December evening. What is printed?","code":"temp = 26\nif temp > 40:\n    print(\"Stay in the shade!\")\nprint(\"Enjoy Abu Dhabi!\")","options":["Stay in the shade! then Enjoy Abu Dhabi!","Enjoy Abu Dhabi!","Stay in the shade!","Nothing"],"points":1,"group":false,"match":"Same Code, a December Evening"},{"id":"s17","type":"mcq","title":"Hinge question 1: what is printed?","code":"score = 50\nif score > 50:\n    print(\"Well done\")\nprint(\"Finished\")","options":["Well done and Finished","Finished","Well done","Error"],"points":1,"hinge":true,"match":"HINGE QUESTION 1"},{"id":"s18","type":"task","title":"Choose your route · 9 minutes · pairs","body":"Open the Saqr-Bot game from today's Teams post and type your full name. When the timer ends, press My progress and hold up your screen.","tasks":["1. 3-minute example with Mr. Mohamed at the help table.\n2. Search: w3schools python if else. In Try it Yourself: run the first example; change a number to make it False; delete the colon, then the indent, and read each error.\n3. Then start the Saqr-Bot game at Zone 1.","Open all 12 crates in Zones 1 and 2.\nDriver moves and clicks; Navigator reads each crate aloud and answers first, with a reason. Swap roles after every crate.\nWrong? Read the explanation, then say the rule to your partner.\nFinished? Carry on into Zone 3.","Speed-run all 12 crates in Zones 1 and 2.\nWrite Two Alerts: ask for temperature and humidity.\nif temp >= 40: print \"Heat alert\"\nif humidity > 70: print \"Humid day\"\nThen Zone 3 to learn if-else early."],"match":"Choose Your Route"},{"id":"s19","type":"mcq","title":"Progress check 1: which symbol must end every if line?","options":[":",";",".","=="],"points":1,"group":false,"match":"Saqr-Bot Recap"},{"id":"s20","type":"mcq","title":"Progress check 2: what is printed?","code":"temp = 35\nif temp > 40:\n    print(\"Hot\")\nprint(\"Done\")","options":["Done","Hot and Done","Hot","Error"],"points":1,"group":false,"match":"Saqr-Bot Recap"},{"id":"s21","type":"mcq","title":"Progress check 3: which line gives a SyntaxError?","options":["if score = 50:","if score == 50:","if score >= 50:","if score != 50:"],"points":1,"group":false,"match":"Saqr-Bot Recap"},{"id":"s22","type":"poll","title":"Midpoint: where are you now?","body":"Move only if your Hinge 1, game or recap quiz shows evidence of SC1. Success criterion 2 (if-else and elif) comes next.","options":["1. Starting: I cannot write an if statement yet","2. Developing: I can predict which lines run in an if statement","3. Secure: I can write if and if-else, and test the boundary","4. Extending: I can use elif in the right order and explain why"],"match":"Review Your Learning"},{"id":"s23","type":"info","title":"I do: if-else, two paths (UAE National Day)","code":"month = 12\nday = 2\nif month == 12 and day == 2:\n    print(\"Happy UAE National Day!\")\nelse:\n    print(\"Have a great day!\")\nprint(\"See you at school\")","body":"Run 1, 2 December: 12 == 12 and 2 == 2 is True → Happy UAE National Day! then See you at school\nRun 2, 15 October: 10 == 12 is False → Have a great day! then See you at school\n\nExactly one block runs: if OR else, never both. Then the paths meet again.\n\nSC2 · Choosing between paths","match":"if-else: Two Paths"},{"id":"s24","type":"mcq","title":"We do: heat warning. What is printed?","code":"temp = 38\nif temp >= 40:\n    print(\"Heat warning\")\nelse:\n    print(\"Normal day\")\nprint(\"Forecast done\")","options":["Heat warning, Forecast done","Normal day, Forecast done","Normal day","Heat warning, Normal day, Forecast done"],"points":1,"group":false,"match":"Heat Warning"},{"id":"s25","type":"mcq","title":"Test the boundary: temp = 40. What does this program print?","code":"if temp >= 40:\n    print(\"Heat warning\")\nelse:\n    print(\"Normal day\")","body":"Bugs hide at the edge. Test just below (39), exactly on (40) and just above (41).","options":["Heat warning","Normal day","Both","Nothing"],"points":1,"group":false,"match":"Test the Boundary"},{"id":"s26","type":"mcq","title":"Hinge question 2: which else line is written correctly?","options":["else x <= 5:","else:","else;","Else:"],"points":1,"group":false,"match":"HINGE QUESTION 2"},{"id":"s27","type":"info","title":"I do: follow the value through if-elif-else","code":"score = 72\nif score >= 90:\n    print(\"Distinction\")\nelif score >= 60:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")","body":"72 >= 90 → False\n72 >= 60 → True → prints Pass\n\nelif means else if: another condition, checked only when everything above was False. Python runs only the FIRST True block.","match":"Follow the Value Through"},{"id":"s28","type":"mcq","title":"Order matters: we swapped the conditions. score = 95. What is printed?","code":"score = 95\nif score >= 60:\n    print(\"Pass\")\nelif score >= 90:\n    print(\"Distinction\")\nelse:\n    print(\"Fail\")","options":["Pass","Distinction","Pass and Distinction","Fail"],"points":1,"group":false,"match":"What If We Swap the Order"},{"id":"s29","type":"info","title":"What a good one looks like: Heat Alert","code":"# Sara Ali, 8 Oct, Heat Alert\n# ask for the temperature\ntemp = int(input(\"Temperature? \"))\n# 40 or more: alert, otherwise safe\nif temp >= 40:\n    print(\"Heat alert: stay indoors\")\nelse:\n    print(\"Safe to go out\")\n# tested: 39, 40, 41","body":"✓ Header comment: name, date, task on line 1\n✓ Plan as comments: each step explained before the code\n✓ Clear names: temp, not t or x1\n✓ Converted input: int() before comparing\n✓ Boundary with >=: 40 itself gives the alert\n✓ Indented blocks: 4 spaces under if and else\n✓ Tests recorded: below, on and above the boundary\n\nUse this as your model for the client brief. Your program should have all seven features.","match":"Model Program: Heat Alert"},{"id":"s30","type":"task","title":"Client brief: the YAA Performance Evaluator","body":"\"At Yas American Academy, teachers want to automate how they evaluate student performance each term. We need a Python program that decides pass or fail, assigns a grade and gives feedback.\"\n\nClient (teacher): explains the brief, gives the test scores, signs off only when every test passes.\nDeveloper: asks up to two questions, writes the code, runs every test. Swap roles for the next task.","tasks":["Start at Task 1: Pass or Fail\n# ask for the score\n# 60 or more: \"Pass\"\n# else: \"Fail\"\nUse if-else. Tests: 59, 60, 61.\nClient signs off, then move on to Task 2.","Start at Task 2: Grade A to F\n# A 90+   B 80–89   C 70–79   D 60–69   F below 60\nUse if / elif / else. Tests: 59, 60, 89, 90.\nClient signs off, then move on to Task 3.","Start at Task 3: Average + Feedback\n# ask for 3 subject scores\n# average, grade, Pass/Fail\n# motivational message\nCombine Tasks 1 and 2 with an average. Test every boundary."],"match":"The YAA Performance Evaluator"},{"id":"s31","type":"info","title":"Self-assess: possible solutions","code":"# Task 1\nscore = int(input(\"Score? \"))\nif score >= 60:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")\n\n# Task 2\nscore = int(input(\"Score? \"))\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 80:\n    print(\"Grade B\")\nelif score >= 70:\n    print(\"Grade C\")\nelif score >= 60:\n    print(\"Grade D\")\nelse:\n    print(\"Grade F\")","body":"Order: check the highest band first. If score >= 60 came first, a 95 would print Grade D.\n>=: tests 59 and 60, 89 and 90 prove every boundary works.\nTask 3: avg = (s1 + s2 + s3) / 3, then use avg in the same chain and add a message.","match":"Possible Solutions"},{"id":"s32","type":"open","title":"Improve and review: what did you fix after comparing your code with the model?","body":"Add it to the end of your code too: /* ---------- grading and tiers ---------- */
function grade(sl, k, a) {
  if (!sl || !TYPES[sl.type] || !TYPES[sl.type].graded || !hasAnswerKey(sl, k) || a == null || a === "") return null;
  switch (sl.type) {
    case "mcq": case "tf": return a === k.correct ? 1 : 0;
    case "multi": {
      if (!Array.isArray(a)) return 0;
      const c = new Set(k.correct || []); let hit = 0, wrong = 0;
      for (const i of a) c.has(i) ? hit++ : wrong++;
      return c.size ? Math.max(0, (hit - wrong) / c.size) : 0;
    }
    case "number": { const n = Number(a); if (!isFinite(n)) return 0; return Math.abs(n - Number(k.correct)) <= Number(k.tol || 0) + 1e-9 ? 1 : 0; }
    case "short": { const norm = s => String(s).toLowerCase().replace(/\s+/g, "").trim(); return (k.accept || []).some(x => norm(x) === norm(a)) ? 1 : 0; }
  }
  return null;
}
function scoreOf(ans) {
  let got = 0, max = 0, n = 0, ggot = 0, gmax = 0, gn = 0, hingeWrong = false;
  for (const sl of slides()) {
    const c = grade(sl, S.keys[sl.id], ans[sl.id]);
    if (c == null) continue;
    const p = Number(sl.points) || 1; got += c * p; max += p; n++;
    if (sl.group !== false) { ggot += c * p; gmax += p; gn++; }
    if (sl.hinge && c < 1) hingeWrong = true;
  }
  return { n, pct: max ? Math.round(100 * got / max) : null, gn, gpct: gmax ? Math.round(100 * ggot / gmax) : null, hingeWrong };
}
function tierFor(sc) {
  if (sc.hingeWrong) return 0;
  if (sc.gn < MIN_ANSWERS || sc.gpct == null) return null;
  const [a, b] = S.live.thresholds || [50, 80];
  return sc.gpct < a ? 0 : sc.gpct < b ? 1 : 2;
}
function studentList() {
  const map = new Map();
  for (const [id, r] of Object.entries(curResponses())) map.set(id, { id, name: r.name || "Student", ans: { ...(r.ans || {}) }, answerTimes: { ...(r.answerTimes || {}) }, online: false });
  for (const p of S.peers) {
    if (p.isMe || p.kind !== "viewer") continue;
    const pr = p.presence || {};
    if (pr.role !== "student" || pr.sid !== S.live.sessionId) continue;
    const id = safeKey(p.by || pr.uid || p.peer);
    const cur = map.get(id) || { id, ans: {} };
    cur.name = String(pr.name || cur.name || "Student").slice(0, 40);
    cur.ans = { ...cur.ans, ...(pr.ans && typeof pr.ans === "object" ? pr.ans : {}) };
    cur.answerTimes = { ...(cur.answerTimes || {}), ...(pr.answerTimes || {}) };
    cur.online = true;
    map.set(id, cur);
  }
  return [...map.values()].map(s => {
    const sc = scoreOf(s.ans); const auto = tierFor(sc);
    const ovr = S.live.overrides && S.live.overrides[s.id];
    const tier = ovr != null ? ovr : (S.live.auto ? auto : (S.live.tiers[s.id] ?? null));
    return { ...s, ...sc, auto, tier, ovr: ovr != null };
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function correctText(sl, k) {
  if (sl.type === "mcq") return LET[k.correct] + " " + ((sl.options || [])[k.correct] ?? "");
  if (sl.type === "tf") return k.correct ? "True" : "False";
  if (sl.type === "multi") return (k.correct || []).map(i => LET[i]).join(", ");
  if (sl.type === "number") return String(k.correct) + (Number(k.tol) ? " ± " + k.tol : "");
  if (sl.type === "short") return (k.accept || []).join(" or ");
  return "";
}
function fmtAns(sl, a) {
  if (a == null || a === "") return "";
  if (sl.type === "mcq" || sl.type === "poll") return (sl.options || [])[a] ?? "?";
  if (sl.type === "tf") return a ? "True" : "False";
  if (sl.type === "multi") return Array.isArray(a) ? a.map(i => LET[i]).join(", ") : "?";
  return String(a);
}
